<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="經典貪吃蛇遊戲 - PWA">
    <title>貪吃蛇 Snake PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
</head>
<body>
    <div class="game-container">
        <h1>🐍 貪吃蛇</h1>
        <div class="score-board">
            <span>分數: <span id="score">0</span></span>
            <span>最高分: <span id="highScore">0</span></span>
        </div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="controls">
            <button id="startBtn">開始遊戲</button>
            <button id="restartBtn" style="display: none;">重新開始</button>
        </div>
        <div class="instructions">
            <p>使用方向鍵或 WASD 控制蛇的移動</p>
            <p>或是使用下方的觸控按鈕</p>
        </div>
        <div class="touch-controls">
            <button class="btn-up" data-dir="up">⬆️</button>
            <div class="btn-row">
                <button class="btn-left" data-dir="left">⬅️</button>
                <button class="btn-down" data-dir="down">⬇️</button>
                <button class="btn-right" data-dir="right">➡️</button>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
